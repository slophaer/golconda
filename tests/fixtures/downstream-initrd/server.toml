# A downstream repository that replaces a package of /base that the initrd takes (dash). The
# initrd takes the image's packages, so it has the downstream one
# (tests/real-packages/image-config.nix).
[golconda]
replaces = ["dash"]

["/system"]
name = "downstream-initrd"
version = "20261103.1"

["/services/sshd"]
