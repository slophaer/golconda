id: if-else-empty
valid:
  # a call: `on` would evaluate it although the condition is false
  - "if c then walk dir else [ ]"
  - "if c then [ 1 ] else [ 2 ]"
invalid:
  - "[ 1 ] ++ (if c then [ 2 ] else [ ])"
  - "{ } // (if c then { a = 1; } else { })"
  - "if c then rec { a = 1; } else { }"
